[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frappe-attachments-s3"
version = "1.0.0"
description = "A frappe app to upload file attachments in doctypes to s3."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "LAB-OF-WEB"},
]
license = {text = "MIT"}

dependencies = [
    "frappe>=10.0.0,<17.0.0",
    "python-magic==0.4.18",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "s3transfer>=0.10.0",
    "six>=1.16.0",
    "urllib3<2.0.0",
]

[project.urls]
Homepage = "https://github.com/LAB-OF-WEB/frappe-attachments-s3"
Repository = "https://github.com/LAB-OF-WEB/frappe-attachments-s3.git"

[tool.setuptools]
packages = ["frappe_attachments_s3"]

[tool.bench.frappe-dependencies]
frappe = ">=10.0.0,<17.0.0"
